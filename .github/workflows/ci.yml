name: ACP workspace
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/*.test.mjs
      - run: node --test examples/activepieces/wechat-stock/*.test.mjs
      - run: pnpm --filter @scottzx/1acp format:check
      - run: pnpm --filter @scottzx/1acp typecheck
      - run: pnpm --filter @scottzx/1acp lint
      - run: pnpm --filter @scottzx/1acp build
      - run: pnpm --filter @scottzx/1acp viewer:typecheck
      - run: pnpm --filter @scottzx/1acp viewer:build
      - run: pnpm --filter @scottzx/1acp check:docs
      - run: pnpm --filter @scottzx/1acp build:test
      - name: Archive runtime tests with executable permissions
        run: tar -czf runtime-tests.tgz -C packages/runtime dist dist-test
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-tests
          path: runtime-tests.tgz
          retention-days: 7
      # The workbench page bundles these two workspace packages, so they are built first.
      - run: pnpm --filter @1agents/file-preview build
      - run: pnpm --filter @1agents/chat-view build
      - run: pnpm --filter @1agents/acp-service build
      - run: pnpm --filter @1agents/acp-service typecheck
      # The RSI role checks run check_outline.py, which needs a jsonschema with Draft 2020-12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'jsonschema>=4.18'
      - run: pnpm --filter @1agents/acp-service test:only
      - name: Archive service build with executable permissions
        run: tar -czf service-build.tgz -C packages/service dist vendor
      - uses: actions/upload-artifact@v4
        with:
          name: service-build
          path: service-build.tgz
          retention-days: 7
  runtime-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [unit-1, unit-2, integration-1, integration-2, integration-3, integration-4, viewer, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: runtime-tests
      - name: Restore runtime tests with executable permissions
        run: |
          tar -xzf runtime-tests.tgz -C packages/runtime
          test -x packages/runtime/dist/cli.js
      - name: Run partitioned runtime tests
        if: matrix.lane != 'coverage'
        run: node scripts/runtime-tests.mjs "$TEST_LANE"
        env:
          TEST_LANE: ${{ matrix.lane }}
      - name: Enforce existing coverage thresholds
        if: matrix.lane == 'coverage'
        run: pnpm --filter @scottzx/1acp test:coverage:only
  dsh-plugin:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_REF: 21638c56315ae6a2b552d6091945d3144c9af32e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_REF }}
          path: .dsh-checkout
      - run: corepack pnpm install --frozen-lockfile
        working-directory: .dsh-checkout
      - uses: actions/cache@v4
        id: dsh-cache
        with:
          path: .dsh-build-cache.tgz
          key: dsh-build-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ env.DSH_REF }}-${{ hashFiles('.dsh-checkout/pnpm-lock.yaml') }}
      - name: Restore fixed DSH build
        if: steps.dsh-cache.outputs.cache-hit == 'true'
        run: tar -xzf .dsh-build-cache.tgz -C .dsh-checkout
      - name: Build fixed DSH checkout
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        run: corepack pnpm run build
        working-directory: .dsh-checkout
      - name: Archive DSH build outputs
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        run: |
          git ls-files --others --ignored --exclude-standard -z -- packages vendor apps/web/dist native/system .dsh-build ':!:**/node_modules/**' > "$RUNNER_TEMP/dsh-build-files"
          test -s "$RUNNER_TEMP/dsh-build-files"
          tar --null -T "$RUNNER_TEMP/dsh-build-files" -czf ../.dsh-build-cache.tgz
        working-directory: .dsh-checkout
      - run: pnpm link:dsh "$GITHUB_WORKSPACE/.dsh-checkout"
      - uses: actions/download-artifact@v4
        with:
          name: service-build
      - name: Restore service build with executable permissions
        run: tar -xzf service-build.tgz -C packages/service
      - run: pnpm --filter @1agents/dsh-acp build
      - run: pnpm --filter @1agents/dsh-acp test:only
      - run: node scripts/embed-dsh.mjs
      - run: node scripts/release-artifacts.mjs
      - run: node scripts/smoke-service-package.mjs release/*.tgz "$GITHUB_WORKSPACE/.dsh-checkout"
      - uses: actions/upload-artifact@v4
        with:
          name: service-package
          path: |
            release/*.tgz
            release/service-manifest.json
          retention-days: 30
