name: ACP workspace
on:
  push:
    branches: [main, develop]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_all: ${{ steps.detect.outputs.run_all }}
      run_runtime: ${{ steps.detect.outputs.run_runtime }}
      run_service: ${{ steps.detect.outputs.run_service }}
      run_dsh: ${{ steps.detect.outputs.run_dsh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed scopes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run_all=false
          run_runtime=false
          run_service=false
          run_dsh=false

          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            run_all=true
          else
            changed=$(git diff --name-only "${BASE_SHA}..HEAD")
            echo "Changed files:"
            echo "$changed"
            if [ -z "$changed" ]; then
              run_all=true
            else
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                case "$file" in
                  package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.github/workflows/ci.yml|scripts/*|tsconfig*.json)
                    run_all=true
                    ;;
                  packages/runtime/*)
                    run_runtime=true
                    run_service=true
                    run_dsh=true
                    ;;
                  packages/service/*|packages/file-preview/*|packages/chat-view/*)
                    run_service=true
                    run_dsh=true
                    ;;
                  .1agents/*|examples/*)
                    run_service=true
                    ;;
                  packages/dsh-plugin/*|packages/dsh-a2a/*)
                    run_dsh=true
                    ;;
                esac
              done <<< "$changed"
            fi
          fi

          if [ "$run_all" = "true" ]; then
            run_runtime=true
            run_service=true
            run_dsh=true
          fi

          {
            echo "run_all=$run_all"
            echo "run_runtime=$run_runtime"
            echo "run_service=$run_service"
            echo "run_dsh=$run_dsh"
          } >> "$GITHUB_OUTPUT"
          echo "Scopes: run_all=$run_all run_runtime=$run_runtime run_service=$run_service run_dsh=$run_dsh"

  runtime-build:
    needs: changes
    if: needs.changes.outputs.run_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scottzx/1acp format:check
      - run: pnpm --filter @scottzx/1acp typecheck
      - run: pnpm --filter @scottzx/1acp lint
      - run: pnpm --filter @scottzx/1acp build
      - run: pnpm --filter @scottzx/1acp viewer:typecheck
      - run: pnpm --filter @scottzx/1acp viewer:build
      - run: pnpm --filter @scottzx/1acp check:docs
      - run: pnpm --filter @scottzx/1acp build:test
      - name: Archive runtime tests with executable permissions
        run: tar -czf runtime-tests.tgz -C packages/runtime dist dist-test
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-tests
          path: runtime-tests.tgz
          retention-days: 7

  service-build:
    needs: changes
    if: needs.changes.outputs.run_service == 'true' || needs.changes.outputs.run_dsh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # acp-service embeds packages/runtime/dist during build, and the workbench page bundles file-preview + chat-view.
      - run: pnpm --filter @scottzx/1acp build
      - run: pnpm --filter @1agents/file-preview build
      - run: pnpm --filter @1agents/chat-view build
      - run: pnpm --filter @1agents/acp-service build
      - run: pnpm --filter @1agents/acp-service typecheck
      - name: Archive service build with executable permissions
        run: tar -czf service-build.tgz -C packages/service dist vendor
      - name: Archive runtime dist for downstream packaging
        run: tar -czf runtime-dist.tgz -C packages/runtime dist
      - uses: actions/upload-artifact@v4
        with:
          name: service-build
          path: service-build.tgz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-dist
          path: runtime-dist.tgz
          retention-days: 7

  service-test:
    needs: [changes, service-build]
    if: needs.changes.outputs.run_service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full git history is required by rsi-pr-cr-eval.test.ts to verify historical PR commit ancestors.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: service-build
      - name: Restore service build with executable permissions
        run: tar -xzf service-build.tgz -C packages/service
      # The RSI role checks run check_outline.py, which needs a jsonschema with Draft 2020-12.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-jsonschema-v1-${{ runner.os }}-${{ runner.arch }}-py312
      - run: python3 -m pip install 'jsonschema>=4.18'
      - run: node --test scripts/*.test.mjs
      - run: node --test examples/activepieces/wechat-stock/*.test.mjs
      - run: pnpm --filter @1agents/acp-service test:only

  runtime-tests:
    needs: [changes, runtime-build]
    if: needs.changes.outputs.run_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [unit-1, unit-2, integration-1, integration-2, integration-3, integration-4, viewer, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: runtime-tests
      - name: Restore runtime tests with executable permissions
        run: |
          tar -xzf runtime-tests.tgz -C packages/runtime
          test -x packages/runtime/dist/cli.js
      - name: Run partitioned runtime tests
        if: matrix.lane != 'coverage'
        run: node scripts/runtime-tests.mjs "$TEST_LANE"
        env:
          TEST_LANE: ${{ matrix.lane }}
      - name: Enforce existing coverage thresholds
        if: matrix.lane == 'coverage'
        run: pnpm --filter @scottzx/1acp test:coverage:only

  dsh-plugin:
    needs: [changes, service-build]
    if: needs.changes.outputs.run_dsh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # dsh-v0.2.1-rc.2, the version the plugin is deployed on; 0.2.0-rc.1 has no ctx.tools.register.
      DSH_REF: 687f282e8625c6b8d11ff58211a90524be2e4317
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_REF }}
          path: .dsh-checkout
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dsh-pnpm-store
          key: dsh-pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.DSH_REF }}-${{ hashFiles('.dsh-checkout/pnpm-lock.yaml') }}
      - run: corepack pnpm install --frozen-lockfile --store-dir "${{ runner.temp }}/dsh-pnpm-store"
        working-directory: .dsh-checkout
      - uses: actions/cache@v4
        id: dsh-cache
        with:
          path: .dsh-build-cache.tgz
          key: dsh-build-v1-${{ runner.os }}-${{ runner.arch }}-node24-${{ env.DSH_REF }}-${{ hashFiles('.dsh-checkout/pnpm-lock.yaml') }}
      - name: Restore fixed DSH build
        if: steps.dsh-cache.outputs.cache-hit == 'true'
        run: tar -xzf .dsh-build-cache.tgz -C .dsh-checkout
      - name: Build fixed DSH checkout
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        run: corepack pnpm run build
        working-directory: .dsh-checkout
      - name: Archive DSH build outputs
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        run: |
          git ls-files --others --ignored --exclude-standard -z -- packages vendor apps/web/dist native/system .dsh-build ':!:**/node_modules/**' > "$RUNNER_TEMP/dsh-build-files"
          test -s "$RUNNER_TEMP/dsh-build-files"
          tar --null -T "$RUNNER_TEMP/dsh-build-files" -czf ../.dsh-build-cache.tgz
        working-directory: .dsh-checkout
      - run: pnpm link:dsh "$GITHUB_WORKSPACE/.dsh-checkout"
      - uses: actions/download-artifact@v4
        with:
          name: service-build
      - name: Restore service build with executable permissions
        run: tar -xzf service-build.tgz -C packages/service
      - run: pnpm --filter @1agents/dsh-acp build
      - run: pnpm --filter @1agents/dsh-acp test:only
      - run: pnpm --filter @1agents/dsh-a2a build
      - run: pnpm --filter @1agents/dsh-a2a typecheck
      - run: pnpm --filter @1agents/dsh-a2a test
      - uses: actions/download-artifact@v4
        with:
          name: runtime-dist
      - name: Restore runtime dist for embed verification
        run: |
          tar -xzf runtime-dist.tgz -C packages/runtime
          test -f packages/runtime/dist/cli.js
      - run: node scripts/embed-dsh.mjs
      - run: node scripts/release-artifacts.mjs
      - run: node scripts/smoke-service-package.mjs release/*.tgz "$GITHUB_WORKSPACE/.dsh-checkout"
      - uses: actions/upload-artifact@v4
        with:
          name: service-package
          path: |
            release/*.tgz
            release/service-manifest.json
          retention-days: 30

  ci-status:
    if: always()
    needs: [changes, runtime-build, runtime-tests, service-build, service-test, dsh-plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required job outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUNTIME_BUILD_RESULT: ${{ needs.runtime-build.result }}
          RUNTIME_TESTS_RESULT: ${{ needs.runtime-tests.result }}
          SERVICE_BUILD_RESULT: ${{ needs.service-build.result }}
          SERVICE_TEST_RESULT: ${{ needs.service-test.result }}
          DSH_PLUGIN_RESULT: ${{ needs.dsh-plugin.result }}
        run: |
          set -euo pipefail
          echo "Job outcomes: changes=$CHANGES_RESULT runtime-build=$RUNTIME_BUILD_RESULT runtime-tests=$RUNTIME_TESTS_RESULT service-build=$SERVICE_BUILD_RESULT service-test=$SERVICE_TEST_RESULT dsh-plugin=$DSH_PLUGIN_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes job did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          for pair in \
            "runtime-build:$RUNTIME_BUILD_RESULT" \
            "runtime-tests:$RUNTIME_TESTS_RESULT" \
            "service-build:$SERVICE_BUILD_RESULT" \
            "service-test:$SERVICE_TEST_RESULT" \
            "dsh-plugin:$DSH_PLUGIN_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Job $name did not succeed: $result" >&2
              exit 1
            fi
          done
