- id: ui-model-selection
  disabled: true
- insert:
    - id: oneagents-acp
      name: '@1agents/acp-service'
      config:
        # `auto` reuses whatever already answers on serviceUrl and only starts its
        # own worker when nothing does, so this default is portable. A host that
        # shares one service-manager-owned daemon sets `serviceMode: launchd` plus
        # `serviceManagerLabel` in its own profile patch; that mode refuses to guess
        # when the manager is absent, which is why it is not the published default.
        serviceMode: auto
        serviceUrl: http://127.0.0.1:36812
        reconnectAttempts: 5
        reconnectDelayMs: 1000
    - id: oneagents-dsh-a2a
      name: '@1agents/acp-service/dsh-a2a'
      disabled: true
      config:
        # Standalone DSH headless/SDK A2A listener + same-origin /workbench/ui host.
        # Shipped disabled because enabling the listener requires an explicit bearer
        # token (`DSH_A2A_TOKEN` or `tokenFile`) and profile-owned storage/port.
        # Turn on its component switch in DSH Plugin Manager or set `disabled: false`
        # in the profile's cordis.patch.yml.
        host: 127.0.0.1
        port: 3080
        publicUrl: http://127.0.0.1:3080
        tokenEnv: DSH_A2A_TOKEN
        runtime:
          command: dsh
          args: ['--profile', 'headless']
