- id: ui-model-selection
  disabled: true
- insert:
    - id: oneagents-acp
      name: '@1agents/acp-service'
      config:
        # `auto` reuses whatever already answers on serviceUrl and only starts its
        # own worker when nothing does, so this default is portable. A host that
        # shares one service-manager-owned daemon sets `serviceMode: launchd` plus
        # `serviceManagerLabel` in its own profile patch; that mode refuses to guess
        # when the manager is absent, which is why it is not the published default.
        serviceMode: auto
        serviceUrl: http://127.0.0.1:36812
        reconnectAttempts: 5
        reconnectDelayMs: 1000
