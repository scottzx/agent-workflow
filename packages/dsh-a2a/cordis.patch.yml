# A bundle patch cannot override a row it never inserts: `id:` only edits a row
# declared by an earlier layer. Without `insert`, the entry is unknown here and
# the whole patch is dropped, which keeps the plugin from loading at all.
- insert:
    - id: oneagents-dsh-a2a
      name: '@1agents/dsh-a2a'
      config:
        host: 127.0.0.1
        port: 3080
        publicUrl: http://127.0.0.1:3080
        tokenEnv: DSH_A2A_TOKEN
        runtime:
          command: dsh
          args: ['--profile', 'headless']